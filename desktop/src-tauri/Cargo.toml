[package]
name = "tftgoldenchanchan-overlay"
version = "0.8.0"
description = "TFTGOLDENCHANCHAN Windows live decision overlay"
authors = ["TFTGOLDENCHANCHAN"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
xcap = { version = "0.9.8", features = ["wgc"] }
image = "0.25"
paddleocr_rs_onnx = { git = "https://github.com/Craun718/PaddleOCR-rs", rev = "3f528d2b2d7924d8e8c651d4fd02d278bdd64476" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
