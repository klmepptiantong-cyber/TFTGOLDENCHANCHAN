[package]
name = "tftgoldenchanchan-overlay"
version = "0.6.0"
description = "TFTGOLDENCHANCHAN Windows live decision overlay"
authors = ["TFTGOLDENCHANCHAN"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
xcap = { version = "0.9.8", features = ["wgc"] }
