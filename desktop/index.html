<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>TFTGOLDENCHANCHAN Overlay</title>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/v042-enhancements.ts"></script>
    <script type="module" src="/src/v043-decision-speed.ts"></script>
  </head>
  <body>
    <main id="overlay" class="overlay-shell">
      <header id="drag-handle" class="titlebar">
        <div>
          <strong>GOLDEN CHANCHAN</strong>
          <span id="snapshot-status" class="status-pill">载入数据…</span>
          <span id="session-status" class="status-pill session-pill">本局 0 个历史点</span>
        </div>
        <nav class="window-actions" aria-label="窗口控制">
          <button id="refresh-data" type="button" title="刷新快照">↻</button>
          <button id="toggle-compact" type="button" title="紧凑模式 Alt+E">▣</button>
          <button id="toggle-click" type="button" title="鼠标穿透 Alt+W">◌</button>
          <button id="hide-overlay" type="button" title="隐藏 Alt+Q">—</button>
        </nav>
      </header>

      <section class="quick-state">
        <label>阶段<input id="stage" value="3-2" /></label>
        <label>人口<input id="level" type="number" min="1" max="10" value="6" /></label>
        <label>金币<input id="gold" type="number" min="0" max="200" value="42" /></label>
        <label>血量<input id="hp" type="number" min="0" max="100" value="78" /></label>
        <label>连胜/败<input id="streak" type="number" min="-20" max="20" value="0" /></label>
      </section>

      <section class="primary-inputs">
        <div class="fast-panel shop-panel">
          <div class="panel-heading">
            <div>
              <strong>当前商店</strong>
              <span>点格子 → 点英雄，最多5张</span>
            </div>
            <button id="clear-shop" class="mini-button" type="button">清空</button>
          </div>
          <input id="shop" type="hidden" />
          <div id="shop-slots" class="shop-slots" aria-label="商店五格">
            <button class="shop-slot" data-slot="0" type="button">1</button>
            <button class="shop-slot" data-slot="1" type="button">2</button>
            <button class="shop-slot" data-slot="2" type="button">3</button>
            <button class="shop-slot" data-slot="3" type="button">4</button>
            <button class="shop-slot" data-slot="4" type="button">5</button>
          </div>
        </div>

        <div class="fast-panel">
          <div class="panel-heading">
            <div>
              <strong>场上棋子</strong>
              <span>英雄点选后可直接 +/- 张数</span>
            </div>
            <button id="add-unit" class="mini-button" type="button">+ 英雄</button>
          </div>
          <div id="units-chips" class="selection-chips"></div>
          <textarea id="units" rows="2" placeholder="蛇女=2, 稻草人=2, 洛=2" aria-label="场上棋子文本备用输入"></textarea>
        </div>
      </section>

      <details id="advanced-panel" open>
        <summary>更多状态</summary>
        <div class="advanced-grid">
          <div class="fast-panel compact-panel">
            <div class="panel-heading">
              <strong>替补席</strong>
              <button id="add-bench" class="mini-button" type="button">+ 英雄</button>
            </div>
            <div id="bench-chips" class="selection-chips"></div>
            <textarea id="bench" rows="2" placeholder="阿木木=1, 德莱文=1"></textarea>
          </div>

          <div class="fast-panel compact-panel">
            <div class="panel-heading">
              <strong>装备</strong>
              <button id="add-item" class="mini-button" type="button">+ 装备</button>
            </div>
            <div id="item-chips" class="selection-chips item-chips"></div>
            <textarea id="items" rows="2" placeholder="眼泪, 朔极之矛, 狂徒铠甲"></textarea>
          </div>

          <div class="fast-panel compact-panel augment-panel">
            <div class="panel-heading">
              <div>
                <strong>强化符文</strong>
                <span>最近使用快速点选 + 手工输入</span>
              </div>
              <button id="add-augment" class="mini-button" type="button">+ 强化</button>
            </div>
            <div id="augment-chips" class="selection-chips"></div>
            <textarea id="augments" rows="2" placeholder="永恒之森之徽, 经济类强化"></textarea>
          </div>

          <label>已装备<textarea id="equipped" rows="2" placeholder="蛇女:朔极之矛/法爆"></textarea></label>
        </div>
      </details>

      <div class="decision-row">
        <button id="decide" class="primary" type="button">生成本回合决策</button>
        <button id="next-round" class="secondary" type="button">下一回合 →</button>
        <button id="undo-round" class="ghost history-action" type="button" title="恢复到上一回合前的状态">↶ 撤销</button>
        <button id="reset-match" class="ghost history-action danger-action" type="button" title="清空本局状态">新开一局</button>
        <button id="unlock" class="ghost" type="button" hidden>解除锁阵</button>
      </div>

      <section id="results" class="results" aria-live="polite">
        <div class="empty-state">点选当前来牌后点击“生成本回合决策”。</div>
      </section>

      <footer>
        <span>Alt+Q 显示/隐藏</span>
        <span>Alt+W 鼠标穿透</span>
        <span>Alt+E 紧凑模式</span>
        <span>Ctrl+Z 撤销回合</span>
      </footer>
    </main>

    <dialog id="picker-dialog" class="picker-dialog">
      <form method="dialog" class="picker-shell">
        <header class="picker-head">
          <div>
            <strong id="picker-title">快速选择</strong>
            <span id="picker-hint">来自当前实时阵容快照</span>
          </div>
          <button value="cancel" type="submit" aria-label="关闭">×</button>
        </header>
        <input id="picker-search" class="picker-search" placeholder="搜索英雄 / 装备" autocomplete="off" />
        <div id="picker-grid" class="picker-grid"></div>
      </form>
    </dialog>

    <dialog id="augment-dialog" class="picker-dialog augment-dialog">
      <form method="dialog" class="picker-shell">
        <header class="picker-head">
          <div>
            <strong>强化符文快速选择</strong>
            <span id="augment-source-label">最近使用</span>
          </div>
          <button value="cancel" type="submit" aria-label="关闭">×</button>
        </header>
        <input id="augment-search" class="picker-search" placeholder="搜索强化名称" autocomplete="off" />
        <div id="augment-grid" class="picker-grid augment-grid"></div>
      </form>
    </dialog>
  </body>
</html>
