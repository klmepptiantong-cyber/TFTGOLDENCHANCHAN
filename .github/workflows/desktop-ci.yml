name: Desktop CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "lib/**"
      - "data/latest.json"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "lib/**"
      - "data/latest.json"
      - ".github/workflows/desktop-ci.yml"

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # A portable build must not require a separately installed MSVC C++ runtime.
      # Cargo/cc-based native dependencies observe crt-static through target features.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: windows-cargo-v2-static-crt-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            windows-cargo-v2-static-crt-
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Audit desktop npm dependencies
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: TypeScript and Vite build
        working-directory: desktop
        run: npm run build
      - name: Rust check
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build portable Windows executable
        working-directory: desktop
        run: npm run build:portable
      - name: Assemble and verify portable OCR runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Resolve-Path "desktop/src-tauri/target/release"
          $exe = Join-Path $release "tftgoldenchanchan-overlay.exe"
          if (!(Test-Path $exe)) { throw "portable exe missing" }

          $portable = "desktop/portable"
          Remove-Item $portable -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $portable | Out-Null
          Copy-Item $exe $portable

          # Preserve any runtime DLLs Cargo already placed next to the executable.
          Get-ChildItem $release -Filter "*.dll" -File -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $portable -Force }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe missing; cannot verify PE dependencies" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsPath) { throw "Visual Studio C++ tools missing; cannot verify PE dependencies" }
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dumpbin) { throw "dumpbin.exe missing; cannot verify PE dependencies" }

          # Inspect the EXE import table. ONNX Runtime may be statically linked; in that
          # case requiring onnxruntime.dll would incorrectly reject a valid portable EXE.
          $deps = (& $dumpbin.FullName /dependents $exe | Out-String)
          Write-Host $deps
          $needsOrtDll = $deps -match '(?i)onnxruntime\.dll'

          if ($needsOrtDll -and !(Test-Path "$portable/onnxruntime.dll")) {
            $candidates = @()
            $candidates += Get-ChildItem "desktop/src-tauri/target" -Filter "onnxruntime.dll" -File -Recurse -ErrorAction SilentlyContinue
            $ortCache = Join-Path $env:LOCALAPPDATA "ort.pyke.io"
            if (Test-Path $ortCache) {
              $candidates += Get-ChildItem $ortCache -Filter "onnxruntime.dll" -File -Recurse -ErrorAction SilentlyContinue
            }
            $runtime = $candidates | Select-Object -First 1
            if (!$runtime) { throw "EXE imports onnxruntime.dll, but no runtime DLL was found in Cargo target or ORT cache" }
            Copy-Item $runtime.FullName "$portable/onnxruntime.dll" -Force
          }

          if ($needsOrtDll) {
            if (!(Test-Path "$portable/onnxruntime.dll")) { throw "dynamic ONNX Runtime dependency missing from portable package" }
            Write-Host "ONNX Runtime linkage: dynamic; runtime DLL packaged."
          } else {
            Write-Host "ONNX Runtime linkage: static/self-contained; no onnxruntime.dll required."
          }

          # A package called portable must not silently depend on an app-local MSVC
          # runtime that is absent from the ZIP. Check every PE file we ship.
          $portablePeFiles = Get-ChildItem $portable -File | Where-Object { $_.Extension -in '.exe', '.dll' }
          foreach ($pe in $portablePeFiles) {
            $peDeps = (& $dumpbin.FullName /dependents $pe.FullName | Out-String)
            Write-Host "Dependencies for $($pe.Name):"
            Write-Host $peDeps
            $runtimeMatches = [regex]::Matches(
              $peDeps,
              '(?im)^\s+(MSVCP\d+(?:_\d+)?\.dll|VCRUNTIME\d+(?:_\d+)?(?:_\d+)?\.dll)\s*$'
            )
            foreach ($match in $runtimeMatches) {
              $runtimeName = $match.Groups[1].Value
              if (!(Test-Path (Join-Path $portable $runtimeName))) {
                throw "$($pe.Name) imports $runtimeName but the portable package does not contain it. Build with static CRT or package an approved redistributable runtime."
              }
            }
          }

          Get-ChildItem $portable | Select-Object Name, Length
      - name: Portable startup smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path "desktop/portable/tftgoldenchanchan-overlay.exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "portable executable exited during startup smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
      - name: Upload portable executable and OCR runtime
        uses: actions/upload-artifact@v4
        with:
          name: TFTGOLDENCHANCHAN-Windows-portable
          path: desktop/portable/**
          if-no-files-found: error
