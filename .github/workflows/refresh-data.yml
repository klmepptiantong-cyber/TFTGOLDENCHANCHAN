name: Refresh TFT data

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0,4,8,12,16,20 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fetch and normalize CN server data
        run: npm run refresh:data
      - name: Validate snapshot schema
        run: npm run check:data
      - name: Commit refreshed snapshot
        run: |
          git config user.name "tftgoldenchanchan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: refresh verified snapshot"
          git push
