name: Refresh TFT data

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0,4,8,12,16,20 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run refresh:data
      - name: Commit refreshed snapshot
        run: |
          git config user.name "tftgoldenchanchan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: refresh snapshot"
          git push
