name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Block high-severity production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check:data
      - run: npm run build
